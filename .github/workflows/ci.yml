name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      # Headless Chromium + its system libraries, for the slide renderer (Phase 2).
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
      # The samples must also render on Linux, not just on the Windows dev box.
      - run: uv run python -m waypoint sample
