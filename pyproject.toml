[project]
name = "waypoint-daily"
version = "0.1.0"
description = "Automated educational Instagram carousels, twice a day."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=10.0",
    "playwright>=1.45",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "textstat>=0.7",
    "trafilatura>=1.12",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
waypoint = "waypoint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waypoint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
