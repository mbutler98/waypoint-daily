# Waypoint Daily configuration. Validated on load by waypoint/config.py.
# Secrets never go here; they live in GitHub Actions secrets (PLAN.md 4.6).

timezone: America/Toronto

# Local publish times (24h, in `timezone`).
slots:
  am: "08:00"
  pm: "18:00"

# Local time the daily draft run prepares tomorrow's posts.
draft_time: "20:00"

# Approval via GitHub Issues. Set to false to post without review.
require_approval: true

# When true, every network write (Instagram, Issues, secrets, Pages) is a logged no-op.
dry_run: true

# Which source kinds each slot prefers (PLAN.md 4.4).
slot_kinds:
  am: [news, paper]
  pm: [evergreen]

# Relative selection weights. Every faculty in PLAN.md 4.4 must be listed.
faculties:
  Animals & Nature: 1.0
  Space: 1.0
  Human Body & Health: 1.0
  Mind & Behaviour: 1.0
  Everyday Physics & Chemistry: 1.0
  Trades & Home: 1.0
  Engineering & Tech: 1.0
  AI & Computing: 1.0
  Money & Markets: 1.0
  History: 1.0
  Geography & Earth: 1.0
  Food & Cooking: 1.0
  Sport & Strength: 1.0
  Flight: 1.0

limits:
  faculty_cooldown_posts: 4     # same faculty not within the last N posts
  topic_cooldown_days: 30       # same topic not within the last N days
  title_jaccard_max: 0.6        # dedupe check 2
  embedding_cosine_max: 0.85    # dedupe check 3
  llm_dedupe_window: 60         # dedupe check 4: compare against the last N key claims
  min_source_words: 300
  max_reading_grade: 7          # Flesch-Kincaid, checked with textstat
  candidates_per_slot: 5
  max_gemini_calls_per_run: 100
  max_writer_retries: 2

gemini:
  # Free-tier model names and rate limits change: check ai.google.dev/gemini-api/docs/models.
  # Verified 2026-10-16: 3.8 Flash and 3.5 Flash-Lite are free-tier stable models; 2.5 Flash is
  # closed to new projects. Per-model RPM/RPD are shown only in AI Studio, so stay conservative.
  model: gemini-3.8-flash            # writer + fact-check (Phase 4)
  fast_model: gemini-3.5-flash-lite  # cheap calls: triage, safety label, dedupe check 4
  embedding_model: gemini-embedding-001
  requests_per_minute: 8

gather:
  user_agent: "waypoint-daily/0.1 (+https://github.com/mbutler98/waypoint-daily)"
  per_host_delay_s: 1.0         # politeness: at most 1 request per second per host
  timeout_s: 20
  cache_ttl_hours: 12           # .cache/http: re-runs within a day don't refetch
  max_items_per_feed: 3
  max_triage: 60                # at most this many candidates get a Gemini triage label
  triage_batch_size: 10         # candidates per triage call
  fallback_items: 6             # Wikipedia-in-faculty articles fetched when a slot runs dry

instagram:
  # Verify the current Graph API version in Meta's docs (Phase 5).
  api_version: v23.0

brand:
  name: Waypoint
  handle: "@waypoint.daily"     # working handle; confirm with the user before creating it
  tagline: "1% smarter, twice a day."
  # Last slide: "<name> · <signoff_kicker>", the post's takeaway, then these fixed lines + handle.
  signoff_kicker: "Today's takeaway"
  signoff_lines:
    - "Stay curious."
    - "Two ideas worth knowing. Every day."
  # Every caption ends with these (the "save" ask lives here, not on the slides).
  caption_cta:
    - "Save this for your next curiosity rabbit hole."
    - "Follow @waypoint.daily for two ideas worth knowing, every day."

pages_base_url: https://mbutler98.github.io/waypoint-daily/
media_retention_days: 14
